# Publishes Typizer and Typizer.Extensions.DependencyInjection to nuget.org when a tag vX.Y.Z is
# pushed to the public repository (the tag must equal <TypizerVersion> in Directory.Build.props).
#
# Authentication is NuGet Trusted Publishing: no long-lived API key in the repository. GitHub issues
# an OIDC token to this workflow, NuGet/login exchanges it for a one-hour API key. One-time setup on
# nuget.org (account owner): Trusted Publishing → policy for repository typizer/typizer-dotnet,
# workflow file release.yml, environment nuget; and the repository secret NUGET_USER = the nuget.org
# profile name (not the e-mail) of the policy owner.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # the OIDC token for NuGet Trusted Publishing
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TYPIZER_MOCK_URL: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The tag is the package version
        run: |
          version="$(sed -n 's:.*<TypizerVersion>\(.*\)</TypizerVersion>.*:\1:p' Directory.Build.props)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match TypizerVersion $version in Directory.Build.props"
            exit 1
          fi

      - name: Test
        run: |
          nohup node tests/Fixtures/mock/server.js > mock.log 2>&1 &
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4010/_mock/health && break; sleep 0.2; done
          dotnet test tests/Typizer.Tests -c Release
          dotnet test tests/Typizer.Tests -c Release -p:TypizerTarget=netstandard2.0

      - name: Pack
        run: dotnet pack Typizer.sln -c Release -o artifacts

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
